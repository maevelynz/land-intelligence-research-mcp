[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "land-intelligence-mcp"
version = "0.1.0"
description = "Governed MCP analytics for independent research on land development optionality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]==2.0.0",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<4",
  "pydantic>=2.7,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/land_intelligence_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
